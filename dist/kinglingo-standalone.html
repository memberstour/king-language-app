/* 킹링고 — Duolingo/Speak 감성의 모바일 우선 디자인
 * 외부 폰트/라이브러리 없이 기기 기본 폰트로 동작합니다.
 */

:root {
  --green: #58cc02;
  --green-dark: #46a302;
  --green-soft: #f3ffe7;
  --green-line: #cdeeb0;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --blue-soft: #e8f6ff;
  --purple: #ce82ff;
  --orange: #ff9600;
  --red: #ff4b4b;
  --red-dark: #ea2b2b;
  --yellow: #ffc800;
  --ink: #2f3542;
  --ink-2: #3c3c3c;
  --muted: #7c8593;
  --muted-2: #98a1b0;
  --line: #eceff3;
  --line-2: #e3e8ee;
  --bg: #ffffff;
  --bg-soft: #f7f9fb;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 22px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
    "Noto Sans KR", "Malgun Gothic", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: #eef2f6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: none;
  text-rendering: optimizeLegibility;
}

button { font-family: inherit; touch-action: manipulation; }

.speech-note {
  margin: 12px 2px 0;
  padding: 10px 12px;
  border-radius: 12px;
  background: #fffaf0;
  border: 1.5px solid #ffe3b0;
  font-size: 11.5px;
  color: #8a7b4a;
  line-height: 1.5;
}

/* ---------- 앱 골격 ---------- */
.app {
  position: relative;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
  box-shadow: 0 0 48px rgba(20, 30, 45, 0.08);
}

.main {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 0 16px 20px;
  scroll-behavior: smooth;
}

.main:focus { outline: none; }

/* ---------- 상단 ---------- */
.topbar {
  flex: 0 0 auto;
  padding: calc(10px + var(--safe-top)) 16px 8px;
  background: #fff;
  z-index: 6;
}

.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.top-row-2 { margin-top: 10px; }

.brand { display: flex; align-items: center; gap: 9px; }

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: linear-gradient(160deg, #7ce31c, var(--green));
  color: #fff;
  font-weight: 900;
  font-size: 20px;
  line-height: 1;
  display: grid;
  place-items: center;
  box-shadow: 0 3px 0 var(--green-dark);
  letter-spacing: -0.5px;
}

.brand-name {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.7px;
  color: var(--ink-2);
}

.top-chips { display: flex; gap: 6px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  background: #f2f4f7;
  color: #6b7280;
  white-space: nowrap;
}

.chip b { font-weight: 900; }
.chip-flame { color: #ff6b00; background: #fff1e6; }
.chip-xp { color: var(--blue-dark); background: var(--blue-soft); }
.chip .ico { width: 13px; height: 13px; }

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: #f1f3f6;
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
  width: 100%;
  min-width: 0;
}

.seg-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  white-space: nowrap;
  border: 0;
  background: transparent;
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
}

.seg-btn.is-active {
  background: #fff;
  color: var(--ink);
  box-shadow: 0 2px 6px rgba(16, 24, 40, 0.1);
}

.seg-flag { font-size: 13px; line-height: 1; }

.chip-goal { color: var(--green-dark); background: #f1faea; }
.top-goal { font-size: 12px; font-weight: 700; color: var(--muted-2); white-space: nowrap; }
.top-goal-label { margin-right: 3px; }
.chip-goal .top-goal-label { color: var(--green-dark); opacity: 0.8; }
.top-goal b { color: var(--ink); font-weight: 900; }
.top-goal-unit { margin-left: 2px; }

/* ---------- 통 요소 ---------- */
.view { animation: view-in 0.22s ease; }

@keyframes view-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.ico { display: inline-flex; width: 20px; height: 20px; flex: 0 0 auto; }
.ico svg { width: 100%; height: 100%; display: block; }

.bar {
  height: 8px;
  border-radius: 999px;
  background: #e9edf2;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--green);
  transition: width 0.4s ease;
}

.bar.on-hero { background: rgba(255, 255, 255, 0.32); margin-top: 14px; }
.bar.on-hero span { background: #fff; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  border-radius: 14px;
  font-weight: 900;
  font-size: 15px;
  padding: 14px 18px;
  cursor: pointer;
  transition: transform 0.06s ease, box-shadow 0.06s ease, opacity 0.15s;
  text-decoration: none;
  line-height: 1.2;
}

.btn:active { transform: translateY(2px); }
.btn:disabled, .btn.is-disabled { opacity: 0.45; box-shadow: none; cursor: default; }
.btn:disabled:active, .btn.is-disabled:active { transform: none; }

.btn-primary { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-dark); }
.btn-primary:active { box-shadow: 0 2px 0 var(--green-dark); }
.btn-blue { background: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); }
.btn-blue:active { box-shadow: 0 2px 0 var(--blue-dark); }
.btn-ghost { background: #fff; color: #6b7280; border: 2px solid var(--line-2); box-shadow: 0 3px 0 #eef1f4; }
.btn-ghost:active { box-shadow: 0 1px 0 #eef1f4; }
.btn-danger { background: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-dark); }
.btn-danger-ghost { background: #fff; color: var(--red); border: 2px solid #ffd1d1; box-shadow: 0 3px 0 #ffe5e5; }
.btn-orange-ghost { background: #fff; color: #e08600; border: 2px solid #ffe3b0; box-shadow: 0 3px 0 #fff3db; }
.btn-small { padding: 10px 13px; font-size: 12.5px; border-radius: 12px; }
.btn-wide { width: 100%; }
.btn-ico { width: 15px; height: 15px; }

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: #fff;
  color: #8b93a1;
  display: inline-grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  flex: 0 0 auto;
}

.icon-btn .ico { width: 18px; height: 18px; }
.icon-btn:active { background: #f6f8fa; }

.round-btn {
  width: 48px;
  height: 48px;
  border-radius: 999px;
  border: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  background: var(--blue);
  color: #fff;
  box-shadow: 0 4px 0 var(--blue-dark);
}

.round-btn .ico { width: 22px; height: 22px; }
.round-btn-blue { margin-top: 14px; }

.card {
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 16px;
  margin-top: 16px;
  box-shadow: 0 2px 0 #f4f6f9;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 20px 2px 9px;
}

.section-head h2 { margin: 0; font-size: 15px; font-weight: 900; letter-spacing: -0.3px; }
.section-head-tight { margin-top: 0; }
.section-right { font-size: 11.5px; font-weight: 800; color: var(--muted-2); white-space: nowrap; }

.view-head { padding: 10px 2px 2px; }
.view-title { margin: 0; font-size: 25px; font-weight: 900; letter-spacing: -0.8px; }
.view-sub { margin: 5px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }

.target {
  margin: 6px 0 4px;
  font-size: 26px;
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: -0.4px;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.target-sm { font-size: 21px; }

.pinyin {
  margin: 4px 0 2px;
  font-size: 14px;
  font-weight: 700;
  color: var(--blue-dark);
  letter-spacing: 0.2px;
  line-height: 1.4;
}

.ko-line { margin: 8px 0 0; font-size: 14px; color: #6b7280; line-height: 1.5; }

.audio-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.tip-inline {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  background: #f7fbff;
  border: 1px solid #e3f1ff;
  border-radius: 12px;
  padding: 10px 12px;
  margin-top: 12px;
}

.tip-inline-label {
  font-size: 10.5px;
  font-weight: 900;
  color: var(--blue-dark);
  background: var(--blue-soft);
  padding: 3px 7px;
  border-radius: 6px;
  white-space: nowrap;
  line-height: 1.2;
}

.tip-inline-text { font-size: 11.5px; color: #5b7488; line-height: 1.5; }

.foot-hint { margin: 6px 0 0; font-size: 11.5px; color: var(--muted-2); text-align: center; }

.card.tip-card {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: #fffdf2;
  border-color: #ffeab0;
  box-shadow: none;
}

.flash {
  margin-top: 10px;
  height: 286px;
  perspective: 1200px;
  cursor: pointer;
  outline: none;
}

.flash-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.flash.is-flipped .flash-inner { transform: rotateY(180deg); }

.flash-face {
  position: absolute;

}

.flash-back { transform: rotateY(180deg); background: linear-gradient(165deg, #ffffff 30%, #eef9ff 100%); border-color: #dceeff; }

.flash-tag {

}

.slot-empty { width: 48px; height: 36px; border-radius: 10px; background: #edf1f6; display: inline-block; }

.slots.is-shake { animation: shake 0.45s ease; }
@keyframes shake {
  10%, 90% { transform: translateX(-2px); }
  20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-6px); }
  40%, 60% { transform: translateX(6px); }
}

.bank { display: flex; flex-wrap: wrap; gap: 6px; min-height: 38px; }

.tile {
  border: 2px solid #e2e8ef;
  background: #fff;
  border-radius: 11px;
  padding: 9px 13px;
  font-size: 14.5px;
  font-weight: 800;
  color: var(--ink-2);
  box-shadow: 0 3px 0 #eef2f7;
  cursor: pointer;
  transition: transform 0.08s, background 0.15s, border-color 0.15s;
  max-width: 100%;
}

.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 #eef2f7; }
.tile-placed { background: #f2f8ff; border-color: #d3e6f8; }

.banner {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 7px;
  line-height: 1.4;
}

.banner-ico { width: 16px; height: 16px; }
.banner-good { background: #f1ffe3; color: #3c7a06; border: 2px solid var(--green-line); }
.banner-bad { background: #fff3f3; color: #cf3434; border: 2px solid #ffdada; }
.banner-info { background: #f2f9ff; color: #2c6b8f; border: 2px solid #d7ecff; }

.quiz-audio { display: flex; justify-content: center; margin: 8px 0 14px; }
.quiz-q { margin: 0 0 12px; font-size: 18px; font-weight: 900; text-align: center; letter-spacing: -0.4px; }

.options { display: flex; flex-direction: column; gap: 8px; }

.option-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 56px;
  padding: 13px 14px;
  border: 2px solid #e7ebf0;
  border-radius: 15px;
  background: #fff;
  box-shadow: 0 3px 0 #f1f4f7;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-2);
  text-align: left;
  cursor: pointer;
  line-height: 1.4;
}

.option-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #f1f4f7; }
.option-mark { width: 20px; height: 20px; display: inline-flex; flex: 0 0 auto; color: var(--green-dark); }
.option-mark .ico { width: 18px; height: 18px; }
.option-text { flex: 1; }

.option-btn.is-correct { border-color: var(--green); background: #f3ffe7; color: #3c7a06; box-shadow: 0 3px 0 #d9f2c0; }
.option-btn.is-wrong { border-color: var(--red); background: #fff2f2; color: #c92f2f; box-shadow: 0 3px 0 #ffd9d9; }
.option-btn.is-locked { cursor: default; }

.quiz-reveal { margin: 10px 2px 0; font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.5; }

/* ---------- 결과 ---------- */
.view-result { text-align: center; padding-top: 6px; }
.result-hero { padding: 24px 0 4px; }
.result-emoji { font-size: 60px; line-height: 1; display: block; animation: pop 0.5s ease; }
@keyframes pop {
  0% { transform: scale(0.4); opacity: 0; }
  70% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
.result-title { margin: 10px 0 0; font-size: 27px; font-weight: 900; letter-spacing: -0.8px; }
.result-sub { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.result-xp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  padding: 9px 16px;
  border-radius: 999px;
  background: #eefbe0;
  color: var(--green-dark);
  font-size: 15px;
  font-weight: 900;
}
.result-xp-ico { width: 16px; height: 16px; }

.result-rows { margin-top: 18px; padding: 4px 16px; border: 2px solid var(--line); border-radius: 18px; background: #fff; text-align: left; }
.result-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #f2f4f7; }
.result-row:last-child { border-bottom: 0; }
.result-row-label { font-size: 12px; color: var(--muted); font-weight: 700; }
.result-row-value { font-size: 13px; font-weight: 900; }

.goal-banner { margin-top: 14px; padding: 13px; border-radius: 14px; background: #f1ffe3; border: 2px solid var(--green-line); color: #3c7a06; font-size: 12.5px; font-weight: 900; }
.result-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }

/* ---------- 탭바 ---------- */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  align-items: stretch;
  padding: 6px 6px calc(6px + var(--safe-bottom));
  background: #fff;
  border-top: 2px solid #f0f3f6;
  z-index: 7;
}

.tabbar.is-hidden { display: none; }

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 0 5px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  font-size: 10.5px;
  font-weight: 800;
  color: #a3acb9;
  cursor: pointer;
  letter-spacing: -0.2px;
  white-space: nowrap;
}

.tab-ico { width: 24px; height: 24px; }
.tab-ico .ico { width: 23px; height: 23px; }
.tab.is-active { color: var(--green-dark); }
.tab.is-active .tab-ico { color: var(--green); }

/* ---------- 토스트 / 시트 / 컨페티 ---------- */
.toast-host {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(88px + var(--safe-bottom));
  display: flex;
  justify-content: center;
  padding: 0 16px;
  pointer-events: none;
  z-index: 60;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
}

.toast-host.is-on { opacity: 1; transform: none; }

.toast-inner {
  background: #2f3542;
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  max-width: 100%;
  text-align: center;
}

.modal-host { position: fixed; inset: 0; z-index: 70; display: none; }
.modal-host.is-open { display: flex; align-items: flex-end; justify-content: center; }
.sheet-back { position: absolute; inset: 0; background: rgba(18, 24, 32, 0.45); }

.sheet {
  position: relative;
  width: 100%;
  max-width: 480px;
  max-height: 88dvh;
  overflow-y: auto;
  background: #fff;
  border-radius: 26px 26px 0 0;
  padding: 10px 18px calc(18px + var(--safe-bottom));
  animation: sheet-up 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.18);
}

@keyframes sheet-up {
  from { transform: translateY(40px); opacity: 0.6; }
  to { transform: none; opacity: 1; }
}

.sheet-grip { width: 38px; height: 4px; border-radius: 999px; background: #e3e8ee; margin: 2px auto 12px; }
.sheet-title { margin: 0 0 10px; font-size: 18px; font-weight: 900; letter-spacing: -0.4px; }
.sheet-body { font-size: 13px; color: var(--ink); }
.sheet-lead { margin: 0 0 8px; font-size: 12.5px; color: #6b7280; line-height: 1.55; }

.steps { margin: 8px 0 0; padding-left: 18px; }
.steps li { margin-bottom: 9px; font-size: 12.5px; line-height: 1.55; color: #6b7280; }
.steps li b { display: block; color: var(--ink); font-size: 12.5px; margin-bottom: 1px; }

.notice { margin-top: 14px; padding: 12px; border-radius: 12px; background: #fff8e6; border: 1.5px solid #ffe9b3; }
.notice b { font-size: 12px; display: block; margin-bottom: 3px; }
.notice p { margin: 0; font-size: 11.5px; color: #8a7b4a; line-height: 1.55; }

.sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

.confetti-host { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }

.confetti-piece {
  position: absolute;
  top: -14px;
  width: 8px;
  height: 12px;
  border-radius: 2px;
  animation: confetti-fall 2.3s linear forwards;
}

@keyframes confetti-fall {
  to { transform: translateY(106vh) rotate(560deg); }
}

/* ---------- 시작 화면 / 폴백 ---------- */
.splash { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 80px 0 40px; }
.splash-mark {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  background: linear-gradient(160deg, #7ce31c, var(--green));
  color: #fff;
  font-size: 34px;
  font-weight: 900;
  display: grid;
  place-items: center;
  box-shadow: 0 5px 0 var(--green-dark);
}
.splash-text { margin: 0; font-size: 12.5px; color: var(--muted-2); font-weight: 700; }

.noscript {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: #fff;
  font-size: 14px;
  text-align: center;
  z-index: 100;
}

/* ---------- 좁은 화면 보정 ---------- */
@media (max-width: 360px) {
  .target { font-size: 23px; }
  .hero-title { font-size: 21px; }
  .flash-ko { font-size: 20px; }
  .flash-text { font-size: 22px; }
  .brand-name { font-size: 18px; }
  .seg-btn { padding: 7px 10px; font-size: 12px; }
  .top-chips .chip { padding: 5px 7px; font-size: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001s !important;
    transition-duration: 0.001s !important;
  }
}

/* ---------- 함께 쓰는 앱 ---------- */
.app-links { display: grid; gap: 8px; }
.app-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: #fff;
  color: inherit;
  text-decoration: none;
}
.app-link.is-active { border-color: var(--green); background: #f8fff2; }
.app-link-name { font-size: 14px; font-weight: 900; }
.app-link-desc { font-size: 11px; font-weight: 700; color: var(--muted-2); text-align: right; }

/* =========================================================
 *  단원평가 · 문제은행 · 영어원서 도서관
 * ========================================================= */

/* ---------- 오늘 화면: 더 배우기 ---------- */
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.feature-tile {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  padding: 12px 10px 11px;
  border: 2px solid var(--line);
  border-radius: 18px;
  background: #fff;
  text-align: left;
  cursor: pointer;
}
.feature-tile:active { transform: translateY(2px); }
.feature-ico { width: 24px; height: 24px; display: inline-flex; margin-bottom: 3px; }
.feature-ico .ico { width: 23px; height: 23px; }
.feature-title { font-size: 13px; font-weight: 900; color: var(--ink); letter-spacing: -0.3px; }
.feature-sub { font-size: 10.5px; font-weight: 800; color: var(--muted-2); }
.ft-green { background: #f7fff0; border-color: #d9f2c0; }
.ft-green .feature-ico { color: var(--green-dark); }
.ft-blue { background: #f2f9ff; border-color: #d7ecff; }
.ft-blue .feature-ico { color: var(--blue-dark); }
.ft-orange { background: #fff9ef; border-color: #ffe6bd; }
.ft-orange .feature-ico { color: #e08600; }

.quick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.quick-row .btn { width: 100%; }

/* ---------- 단원평가 ---------- */
.exam-summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 16px;
  border-radius: 20px;
  background: linear-gradient(150deg, #60d10a, var(--green));
  color: #fff;
  box-shadow: 0 5px 0 var(--green-dark);
  margin-bottom: 14px;
}
.exam-summary-main { display: flex; flex-direction: column; align-items: center; min-width: 96px; }
.exam-summary-num { font-size: 26px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
.exam-summary-label { font-size: 10.5px; font-weight: 800; opacity: 0.92; margin-top: 4px; }
.exam-summary-side { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 700; opacity: 0.94; line-height: 1.45; }

.exam-list { display: flex; flex-direction: column; gap: 7px; }
.exam-row {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 11px 12px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: #fff;
  text-align: left;
  cursor: pointer;
}
.exam-row:active { transform: scale(0.99); background: #fafcfe; }
.exam-row.is-passed { background: #fbfff5; border-color: #e0f5cd; }
.exam-emoji {
  width: 38px; height: 38px; flex: 0 0 auto;
  display: grid; place-items: center;
  font-size: 19px;
  border-radius: 12px;
  background: var(--bg-soft);
}
.exam-copy { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.exam-day { font-size: 9.5px; font-weight: 900; letter-spacing: 0.08em; color: var(--muted-2); }
.exam-title { font-size: 14px; font-weight: 900; color: var(--ink); letter-spacing: -0.3px; }
.exam-goal { font-size: 10.5px; color: var(--muted-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exam-score { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex: 0 0 auto; }
.exam-score b { font-size: 13px; font-weight: 900; color: var(--muted); }
.exam-score span { font-size: 10px; font-weight: 800; color: var(--muted-2); }
.exam-score.is-good b, .exam-score.is-good span { color: var(--green-dark); }
.exam-score.is-mid b { color: #d98200; }
.exam-score.is-low b { color: var(--red); }

/* ---------- 공통: 가로 꽉 찬 세그먼트 ---------- */
.seg-block { display: flex; width: 100%; margin: 12px 0 14px; }
.seg-block .seg-btn { flex: 1; justify-content: center; padding: 9px 6px; }

/* ---------- 문제은행 ---------- */
.mock-card {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px;
  border-radius: 18px;
  background: linear-gradient(140deg, #2ec4ff, var(--blue));
  color: #fff;
  box-shadow: 0 4px 0 var(--blue-dark);
  margin-bottom: 12px;
}
.mock-emoji { font-size: 26px; line-height: 1; }
.mock-copy { flex: 1; min-width: 0; }
.mock-title { margin: 0; font-size: 15px; font-weight: 900; letter-spacing: -0.4px; }
.mock-sub { margin: 2px 0 0; font-size: 10.5px; font-weight: 700; opacity: 0.92; }
.mock-card .btn-primary { flex: 0 0 auto; background: #fff; color: var(--blue-dark); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.16); }

.filter-card { padding: 14px; }
.filter-label { margin: 12px 0 6px; font-size: 11px; font-weight: 900; color: var(--muted-2); letter-spacing: 0.02em; }
.filter-card .filter-label:first-of-type { margin-top: 4px; }
.filter-chip { font-size: 11.5px; padding: 7px 11px; }
.seg-count { margin: 0 0 6px; }

.wrong-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 2px 12px; }
.wrong-count { font-size: 16px; font-weight: 900; display: block; letter-spacing: -0.3px; }
.wrong-sub { font-size: 11px; color: var(--muted-2); font-weight: 700; }
.wrong-list { display: flex; flex-direction: column; gap: 7px; }
.wrong-row {
  display: flex;
  align-items: stretch;
  gap: 4px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: #fff;
  overflow: hidden;
}
.wrong-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 11px 12px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.wrong-type { font-size: 9.5px; font-weight: 900; color: var(--blue-dark); letter-spacing: 0.02em; }
.wrong-text { font-size: 12.5px; font-weight: 800; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrong-meta { font-size: 10px; color: var(--muted-2); font-weight: 700; }
.wrong-del { width: 42px; height: auto; align-self: stretch; border-left: 1px solid var(--line); border-radius: 0; color: var(--muted-2); background: #fbfcfe; }
.wrong-del .ico { width: 15px; height: 15px; }

.empty-card {
  padding: 26px 20px;
  border: 2px dashed var(--line-2);
  border-radius: 20px;
  background: #fbfcfe;
  text-align: center;
}
.empty-emoji { font-size: 34px; display: block; }
.empty-title { margin: 8px 0 0; font-size: 16px; font-weight: 900; letter-spacing: -0.3px; }
.empty-sub { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.55; }

/* ---------- 문제 풀기 ---------- */
.view-run { display: flex; flex-direction: column; min-height: calc(100dvh - 140px); }
.run-meta { display: flex; align-items: center; gap: 7px; margin: 12px 0 10px; }
.run-type {
  font-size: 10.5px;
  font-weight: 900;
  color: var(--blue-dark);
  background: var(--blue-soft);
  padding: 4px 9px;
  border-radius: 999px;
  flex: 0 0 auto;
}
.run-unit { font-size: 10.5px; font-weight: 800; color: var(--muted-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-count { font-size: 11px; font-weight: 900; color: var(--muted-2); flex: 0 0 auto; }
.run-top-label { font-size: 14px; font-weight: 900; color: var(--ink); }
.run-body { flex: 1 1 auto; padding-top: 4px; }
.run-ask { margin: 6px 0 10px; font-size: 15px; font-weight: 900; color: var(--ink); letter-spacing: -0.4px; }
.run-audio { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; }
.run-ko {
  margin: 0 0 14px;
  padding: 14px;
  border-radius: 16px;
  background: var(--bg-soft);
  border: 2px solid var(--line);
  font-size: 19px;
  font-weight: 900;
  line-height: 1.42;
  letter-spacing: -0.5px;
  word-break: keep-all;
}
.blank-text { letter-spacing: 0.3px; }
.blank-slot {
  display: inline-block;
  min-width: 46px;
  padding: 0 4px;
  border-bottom: 3px solid var(--blue);
  color: var(--blue-dark);
  text-align: center;
}
.option-key {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  display: inline-grid;
  place-items: center;
  border-radius: 999px;
  background: #f1f4f7;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 900;
}
.option-btn.is-picked { border-color: var(--blue); background: #f2f9ff; box-shadow: 0 3px 0 #d7ecff; }
.option-btn.is-picked .option-key { background: var(--blue); color: #fff; }
.option-btn.is-correct .option-key, .option-btn.is-wrong .option-key { background: transparent; }
.run-foot { padding: 10px 0 4px; }
.run-verdict {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 12px;
  line-height: 1.5;
}
.run-verdict b { font-size: 13px; font-weight: 900; }
.run-verdict.is-good { background: #f4ffe9; border: 2px solid var(--green-line); color: #3c7a06; }
.run-verdict.is-bad { background: #fff2f2; border: 2px solid #ffd1d1; color: #c92f2f; }
.run-verdict .run-tip { font-style: normal; font-size: 11.5px; color: #6b7280; margin-top: 3px; }

/* ---------- 결과 리포트 ---------- */
.view-report { padding-bottom: 8px; }
.report-hero { text-align: center; padding: 14px 0 2px; }
.report-score { margin: 6px 0 0; font-size: 42px; font-weight: 900; letter-spacing: -1.6px; line-height: 1.05; }
.report-title { margin: 4px 0 0; font-size: 16px; font-weight: 900; color: var(--ink); letter-spacing: -0.3px; }
.report-sub { margin: 5px 0 0; font-size: 12px; color: var(--muted); }
.report-perfect {
  margin: 16px 0 0;
  padding: 14px;
  border-radius: 14px;
  background: #f1ffe3;
  border: 2px solid var(--green-line);
  color: #3c7a06;
  font-size: 12.5px;
  font-weight: 800;
  text-align: center;
}
.report-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.explain-card {
  margin-top: 8px;
  padding: 13px 14px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: #fff;
}
.explain-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.explain-no {
  width: 20px; height: 20px;
  display: inline-grid; place-items: center;
  border-radius: 999px;
  background: #fff2f2;
  color: #c92f2f;
  font-size: 10.5px;
  font-weight: 900;
}

    /** 한 문장을 읽고 끝나면 알려 줍니다. (오디오북 연속 재생용) */
    function speakCue(text, loc, rate, onEnd) {
      if (!supported || !text) {
        if (onEnd) onEnd(false);
        return false;
      }
      try {
        global.speechSynthesis.cancel();
        var u = new global.SpeechSynthesisUtterance(text);
        u.lang = loc;
        u.rate = rate || 1;
        u.pitch = 1;
        var v = pick(loc);
        if (v) u.voice = v;
        u.onend = function () { if (onEnd) onEnd(true); };
        u.onerror = function () { if (onEnd) onEnd(false); };
        global.speechSynthesis.speak(u);
        return true;
      } catch (e) {
        if (onEnd) onEnd(false);
        return false;
      }
    }
    return { supported: supported, speak: speak, speakCue: speakCue, stop: stop, refresh: refresh };
  })();

  /** 문장 하나를 듣고 따라 말하는 카드. Speak 탭과 말하기 수업에서 함께 씁니다. */
  function buildVoiceCard(s, opts) {
    opts = opts || {};
    var slow = !!S.get().prefs.slow;
    var card = el("div", { class: "voice-card" });
    var status = el("p", { class: "mic-status", "aria-live": "polite" },
      ["마이크를 누르고 문장을 따라 말해 보세요"]);
    var micBtn = null;
    var fallback = null;

    card.appendChild(el("p", { class: "target", lang: L(), text: s.text }));
    if (reading(s)) card.appendChild(el("p", { class: "pinyin", text: reading(s) }));
    if (opts.showKo !== false) card.appendChild(el("p", { class: "ko-line", text: s.ko }));

    var speedBtns = [];
    function applySpeed() {
      speedBtns.forEach(function (b) {
        var on = b.getAttribute("data-slow") === "1" ? slow : !slow;
        if (on) b.classList.add("is-active"); else b.classList.remove("is-active");
      });
    }
    var speedWrap = el("div", { class: "speed" }, [
      el("button", {
        class: "speed-btn", type: "button", dataset: { slow: "0" },
        on: { click: function () { slow = false; S.setPref("slow", false); applySpeed(); playSentence(s, false); } }
      }, ["보통"]),
      el("button", {
        class: "speed-btn", type: "button", dataset: { slow: "1" },
        on: { click: function () { slow = true; S.setPref("slow", true); applySpeed(); playSentence(s, true); } }
      }, ["천천히"])
    ]);
    speedBtns = speedWrap.children ? Array.prototype.slice.call(speedWrap.children) : [];

    card.appendChild(el("div", { class: "voice-audio" }, [
      el("button", {
        class: "play-btn", type: "button", "aria-label": "문장 듣기",
        on: { click: function () { playSentence(s, slow); } }
      }, [icon("speaker")]),
      el("button", {
        class: "btn btn-ghost btn-small", type: "button",
        on: { click: function () { playSentence(s, true); } }
      }, [icon("slow", "btn-ico"), "천천히 듣기"]),
      speedWrap
    ]));

    if (s.tip) {
      card.appendChild(el("div", { class: "tip-inline" }, [
        el("span", { class: "tip-inline-label", text: "발음 팁" }),
        el("span", { class: "tip-inline-text", text: s.tip })
      ]));
    }

    var feedbackSlot = el("div", { class: "feedback-slot", "aria-live": "polite" });
    card.appendChild(feedbackSlot);

    function attempt(ratio, transcript) {
      UI.micOn = false;
      if (micBtn) micBtn.classList.remove("is-listening");
      if (ratio === null) {
        status.textContent = "직접 말해봤어요! 소리 내어 읽는 것만으로도 충분해요.";
        status.className = "mic-status is-good";
      } else {
        status.textContent = "잘 들었어요. 아래 점수를 확인해 보세요.";
        status.className = "mic-status";
      }
      renderFeedback(feedbackSlot, ratio, transcript, s);
      if (opts.onAttempt) opts.onAttempt(ratio);
    }

    function setListening(on) {
      UI.micOn = on;
      if (micBtn) {
        if (on) micBtn.classList.add("is-listening");
        else micBtn.classList.remove("is-listening");
      }
      if (on) {
        status.textContent = "듣고 있어요… 문장을 말해 보세요";
        status.className = "mic-status is-live";
      }
    }

    function listen() {
      var Ctor = global.SpeechRecognition || global.webkitSpeechRecognition;
      if (!Ctor) {
        status.textContent = "이 브라우저는 말하기 인식을 지원하지 않아요. '직접 말해봤어요 ✓'를 눌러 주세요.";
        status.className = "mic-status is-warn";
        if (fallback) fallback.classList.add("is-attention");
        return;
      }
      stopRecognize();
      var rec;
      try {
        rec = new Ctor();
        rec.lang = locale();
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        rec.continuous = false;
        rec.onstart = function () { setListening(true); };
        rec.onresult = function (ev) {
          var transcript = "";
          try { transcript = ev.results[0][0].transcript || ""; } catch (e) { transcript = ""; }
          var ratio = C.similarity(s.text, transcript, L());
          setListening(false);
          attempt(ratio, transcript);
        };
        rec.onerror = function (ev) {
          setListening(false);
          var msg = micErrorMessage(ev && ev.error);
          if (msg) {
            status.textContent = msg;
            status.className = "mic-status is-warn";
          }
          if (fallback) fallback.classList.add("is-attention");
        };
        rec.onend = function () { setListening(false); };
        UI.recog = rec;
        rec.start();
        setListening(true);
      } catch (e) {
        setListening(false);
        status.textContent = "마이크를 시작하지 못했어요. '직접 말해봤어요 ✓'를 눌러 주세요.";
        status.className = "mic-status is-warn";
        if (fallback) fallback.classList.add("is-attention");
      }
    }

    card.appendChild(el("div", { class: "mic-wrap" }, [
      el("button", {
        class: "mic-btn", type: "button", "aria-label": "마이크로 따라 말하기",
        on: { click: listen }
      }, [icon("mic"), el("span", { class: "mic-btn-label", text: "눌러서 말하기" })]),
      status
    ]));

    fallback = el("button", {
      class: "btn btn-ghost btn-wide fallback-btn", type: "button",
      on: { click: function () { attempt(null, null); } }
    }, ["직접 말해봤어요 ✓"]);
    card.appendChild(fallback);

    applySpeed();
    return { node: card, status: status };
  }

  function renderFeedback(slot, ratio, transcript, s) {
    clear(slot);
    if (ratio === null) {
      slot.appendChild(el("div", { class: "fb fb-good" }, [
        el("span", { class: "fb-emoji", text: "👏" }),
        el("div", { class: "fb-copy" }, [
          el("p", { class: "fb-title", text: "직접 말해봤어요!" }),
          el("p", { class: "fb-desc", text: "다음 문장도 이어서 해볼까요?" })
        ])
      ]));
      return;
    }
    var fb = C.feedbackFor(ratio);
    var pct = Math.round(ratio * 100);
    var tone = fb.tone === "again" ? "bad" : fb.tone === "ok" ? "ok" : "good";
    slot.appendChild(el("div", { class: "fb fb-" + tone }, [
      el("span", { class: "fb-score", text: pct + "%" }),
      el("div", { class: "fb-copy" }, [
        el("p", { class: "fb-title", text: fb.title }),
        el("p", { class: "fb-desc", text: fb.desc }),
        transcript ? el("p", { class: "fb-heard", text: "들린 말: “" + transcript + "”" }) : null,
        el("p", { class: "fb-target", text: "문장: " + s.text })
      ])
    ]));
  }

  /* ---------- 수업 ---------- */
  function startLesson(unitNo, lessonNo) {
    var unit = S.unitOf(L(), unitNo || 1);
    var lesson = D.lessons[Math.max(0, Math.min(D.lessons.length - 1, (lessonNo || 1) - 1))];
    var steps = [];
    if (lesson.key === "quiz") {
      var qs = C.buildMeaningQuiz(unit.sentences, allSentences(L()), unit.sentences.length);
      qs.forEach(function (q) { steps.push({ type: "quiz", q: q, answered: false, correct: null, spoken: false }); });
    } else if (lesson.key === "build") {
      unit.sentences.forEach(function (s) {
        var tokens = C.tokenize(s);
        var bank = C.shuffle(tokens.map(function (t, i) { return { id: i, text: t }; }));
        steps.push({ type: "build", s: s, tokens: tokens, bank: bank, placed: [], status: "idle", attempts: 0, spoken: false });
      });
    } else if (lesson.key === "speak") {
      unit.sentences.forEach(function (s) { steps.push({ type: "speak", s: s, attempted: false }); });
    } else {
      unit.sentences.forEach(function (s) { steps.push({ type: "learn", s: s, spoken: false }); });
    }
    UI.lesson = {
      unit: unit,
      lesson: lesson,
      steps: steps,
      idx: 0,
      correct: 0,
      total: 0,
      result: null,
      finished: false
    };
    UI.view = "lesson";
    stopRecognize();
    try {
      if (global.history && global.history.pushState) global.history.pushState({ kingLesson: true }, "");
    } catch (e) { /* noop */ }
    render();
  }

  function currentStep() {
    return UI.lesson ? UI.lesson.steps[UI.lesson.idx] : null;
  }

    render();
  }

  function viewLesson() {
    var lesson = UI.lesson;
    if (!lesson) return el("div", { class: "view" });
    if (lesson.finished) return renderResult();

    var step = currentStep();
    var body = el("div", { class: "lesson-body" });
    var foot = el("div", { class: "lesson-foot" });
    var wrap = el("div", { class: "view view-lesson" });

    wrap.appendChild(el("div", { class: "lesson-meta" }, [
      el("span", { class: "lesson-emoji", text: lesson.lesson.emoji }),
      el("span", { class: "lesson-name", text: "Day " + lesson.unit.no + " · " + lesson.unit.title }),
      el("span", { class: "lesson-xp", text: "+" + lesson.lesson.xp + " XP" })
    ]));

    if (step.type === "learn") renderLearnStep(step, body, foot);
    else if (step.type === "build") renderBuildStep(step, body, foot);
    else if (step.type === "quiz") renderQuizStep(step, body, foot);
    else renderSpeakStep(step, body, foot);

    wrap.appendChild(body);
    wrap.appendChild(foot);
    return wrap;
  }

  function footButton(label, handler, opts) {
    opts = opts || {};
    return el("button", {
      class: "btn btn-wide " + (opts.tone === "ghost" ? "btn-ghost" : "btn-primary") + (opts.disabled ? " is-disabled" : ""),
      type: "button",
      disabled: opts.disabled ? "disabled" : false,
      on: {
        click: function () {
          if (opts.disabled) return;
          handler();
        }
      }
    }, [label]);
  }

  function nextStep() {
    var lesson = UI.lesson;
    if (!lesson) return;
    stopRecognize();
    if (lesson.idx >= lesson.steps.length - 1) {
      finishLesson();
      return;
    }
    lesson.idx += 1;
    render();
  }

  function finishLesson() {
    var lesson = UI.lesson;
    if (!lesson) return;
    var accuracy = lesson.total > 0 ? Math.round((lesson.correct / lesson.total) * 100) : null;
    var res = S.completeLesson(lesson.unit, lesson.lesson, { accuracy: accuracy });
    lesson.result = {
      xp: res.xp,
      first: res.first,
      accuracy: accuracy,
      correct: lesson.correct,
      total: lesson.total
    };
    lesson.finished = true;
    beep("win");
    confetti();
    render();
  }

  function renderResult() {
    var lesson = UI.lesson;
    var res = lesson.result || { xp: 0, first: false, accuracy: null };
    var perfect = res.accuracy !== null && res.accuracy === 100;
    var wrap = el("div", { class: "view view-result" });
    var goalDone = S.todayXp() >= D.dailyGoal;

    wrap.appendChild(el("div", { class: "result-hero" }, [
      el("span", { class: "result-emoji", text: perfect ? "🏆" : "🎉" }),
      el("h1", { class: "result-title", text: res.first ? "수업 완료!" : "복습 완료!" }),
      el("p", { class: "result-sub", text: "Day " + lesson.unit.no + " · " + lesson.lesson.title }),
      el("div", { class: "result-xp" }, [
        icon("bolt", "result-xp-ico"),
        el("span", { text: res.xp > 0 ? "+" + res.xp + " XP" : "XP는 이미 받았어요" })
      ])
    ]));

    var rows = el("div", { class: "result-rows" });
    rows.appendChild(resultRow("정확도", res.accuracy === null ? "끝까지 완료" : res.accuracy + "%"));
    rows.appendChild(resultRow("오늘 XP", S.todayXp() + " / " + D.dailyGoal));
    rows.appendChild(resultRow("스트릭", S.streakInfo().count + "일 연속 🔥"));
    rows.appendChild(resultRow("이 단원", S.doneLessons(lesson.unit.id) + " / 4 수업"));
    wrap.appendChild(rows);

    if (S.isUnitDone(lesson.unit.id)) {
      wrap.appendChild(el("div", { class: "goal-banner" }, ["Day " + lesson.unit.no + " 완료! 이 단원 문장 5개를 모두 익혔어요 🎉"]));
    }
    if (goalDone) {
      wrap.appendChild(el("div", { class: "goal-banner" }, ["오늘의 목표 달성! 🎉 내일도 이어서 만나요"]));
    }

    var nextLessonNo = lesson.lesson.no < D.lessons.length ? lesson.lesson.no + 1 : 0;
    var nextDayNo = lesson.unit.no + 1;
    wrap.appendChild(el("div", { class: "result-actions" }, [
      el("button", {
        class: "btn btn-primary btn-wide", type: "button",
        on: {
          click: function () {
            if (nextLessonNo) startLesson(lesson.unit.no, nextLessonNo);
            else if (nextDayNo <= course().units.length) startLesson(nextDayNo, 1);
            else finishDayAll();
          }
        }
      }, [nextLessonNo ? "다음 수업 · " + D.lessons[nextLessonNo - 1].title : "다음 날로"]),
      el("button", {
        class: "btn btn-ghost btn-wide", type: "button",
        on: { click: function () { closeLesson(); } }
      }, ["오늘 화면으로"])
    ]));

    return wrap;
  }

  function finishDayAll() {
    beep("win");
    openSheet("14일 코스를 모두 끝냈어요!", [
      el("p", { class: "sheet-lead", text: "모든 코스를 언제든 다시 복습할 수 있어요. 꾸준함이 제일 큰 실력이에요." }),
      el("div", { class: "sheet-actions" }, [
        el("button", { class: "btn btn-primary btn-wide", type: "button", on: { click: function () { openSheetClose(); closeLesson(); } } }, ["확인"])
      ])
    ]);
  }

  function resultRow(label, value) {
    return el("div", { class: "result-row" }, [
      el("span", { class: "result-row-label", text: label }),
      el("b", { class: "result-row-value", text: value })
    ]);
  }

  /* --- 1) 익히기 --- */
  function renderLearnStep(step, body, foot) {
    var s = step.s;
    var lesson = UI.lesson;
    body.appendChild(el("p", { class: "eyebrow", text: "새 문장 " + (lesson.idx + 1) + " / " + lesson.steps.length }));

    body.appendChild(el("div", { class: "card learn-card" }, [
      el("p", { class: "target", lang: L(), text: s.text }),
      reading(s) ? el("p", { class: "pinyin", text: reading(s) }) : null,
      el("div", { class: "audio-row" }, [
        el("button", { class: "btn btn-blue btn-small", type: "button", on: { click: function () { playSentence(s, false); } } },
          [icon("speaker", "btn-ico"), "듣기"]),
        el("button", { class: "btn btn-ghost btn-small", type: "button", on: { click: function () { playSentence(s, true); } } },
          [icon("slow", "btn-ico"), "천천히"])
      ]),
      el("div", { class: "learn-divider" }),
      el("p", { class: "ko-line", text: s.ko }),
      s.tip ? el("div", { class: "tip-inline" }, [
        el("span", { class: "tip-inline-label", text: course().tipLabel }),
        el("span", { class: "tip-inline-text", text: s.tip })
      ]) : null
    ]));

    if (!step.spoken) {
      step.spoken = true;
      playSentence(s, S.get().prefs.slow);
    }

    foot.appendChild(footButton(lesson.idx >= lesson.steps.length - 1 ? "완료하기" : "다음 문장", nextStep));
  }

  /* --- 2) 문장 만들기 --- */
  function renderBuildStep(step, body, foot) {
    var lesson = UI.lesson;
    var s = step.s;
    body.appendChild(el("p", { class: "eyebrow", text: "문장 만들기 " + (lesson.idx + 1) + " / " + lesson.steps.length }));
    body.appendChild(el("p", { class: "ko-prompt", text: s.ko }));
    body.appendChild(el("div", { class: "build-audio" }, [
      el("button", { class: "btn btn-blue btn-small", type: "button", on: { click: function () { playSentence(s, false); } } },
        [icon("speaker", "btn-ico"), "문장 듣기"]),
      el("button", { class: "btn btn-ghost btn-small", type: "button", on: { click: function () { playSentence(s, true); } } },
        [icon("slow", "btn-ico"), "천천히"])
    ]));

    var slots = el("div", { class: "slots" + (step.status === "bad" ? " is-shake" : "") });
    if (!step.placed.length) {
      slots.appendChild(el("span", { class: "slots-empty", text: "아래 블록을 눌러 순서대로 놓아 보세요" }));
    } else {
      step.placed.forEach(function (tile, i) {
        slots.appendChild(el("button", {
          class: "tile tile-placed", type: "button",
          on: {
            click: function () {
              if (step.status === "ok") return;
              step.placed.splice(i, 1);
              step.bank.push(tile);
              step.status = "idle";
              render();
            }
          }
        }, [tile.text]));
      });
    }
    if (step.placed.length && step.placed.length < step.tokens.length) {
      slots.appendChild(el("span", { class: "slot-empty" }));
    }
    body.appendChild(slots);

    var bank = el("div", { class: "bank" });
    step.bank.forEach(function (tile) {
      bank.appendChild(el("button", {
        class: "tile", type: "button",
        on: {
          click: function () {
            if (step.status === "ok" || step.status === "reveal") return;
            var i = step.bank.indexOf(tile);
            if (i >= 0) step.bank.splice(i, 1);
            step.placed.push(tile);
            step.status = "idle";
            render();
          }
        }
      }, [tile.text]));
    });
    body.appendChild(bank);

    if (step.status === "ok") {
      body.appendChild(el("div", { class: "banner banner-good" }, [icon("check", "banner-ico"), "정답이에요! +2 XP"]));
    } else if (step.status === "bad") {
      body.appendChild(el("div", { class: "banner banner-bad" }, ["순서가 조금 달라요. 다시 맞춰 볼까요?"]));
    } else if (step.status === "reveal") {
      body.appendChild(el("div", { class: "banner banner-info" }, ["정답: " + s.text]));
    }

    var allPlaced = step.placed.length === step.tokens.length;
    if (step.status === "ok") {
      foot.appendChild(footButton(lesson.idx >= lesson.steps.length - 1 ? "완료하기" : "계속", nextStep));
    } else if (step.status === "bad") {
      foot.appendChild(footButton("다시 하기", function () {
        step.placed = [];
        step.bank = C.shuffle(step.bank.concat([]));
        step.status = "idle";
        render();
      }, { tone: "ghost" }));
    } else if (step.status === "reveal") {
      foot.appendChild(footButton("다음 문장", nextStep));
    } else {
      foot.appendChild(footButton("확인", function () {
        var userText = step.placed.map(function (t) { return t.text; }).join(joiner());
        var answerText = step.tokens.join(joiner());
        var ok = C.normalize(userText, L()) === C.normalize(answerText, L());
        lesson.total += 1;
        if (ok) {
          if (step.attempts === 0) lesson.correct += 1;
          step.status = "ok";
          S.addXp(2);
          beep("correct");
        } else {
          step.attempts += 1;
          step.status = step.attempts >= 2 ? "reveal" : "bad";
          beep("wrong");
        }
        render();
      }, { disabled: !allPlaced }));
    }
  }

  /* --- 3) 듣기 퀴즈 --- */
  function renderQuizStep(step, body, foot) {
    var lesson = UI.lesson;
    var q = step.q;
    body.appendChild(el("p", { class: "eyebrow", text: "듣기 퀴즈 " + (lesson.idx + 1) + " / " + lesson.steps.length }));
    body.appendChild(el("div", { class: "quiz-audio" }, [
      el("button", {
        class: "play-btn play-btn-lg", type: "button", "aria-label": "문장 다시 듣기",
        on: { click: function () { playSentence(q.sentence, false); } }
      }, [icon("speaker")])
    ]));
    body.appendChild(el("p", { class: "quiz-q", text: "무슨 뜻일까요?" }));
    if (!step.spoken) {
      step.spoken = true;
      playSentence(q.sentence, false);
    }

    var options = el("div", { class: "options" });
    q.options.forEach(function (opt) {
      var cls = " option";
      if (step.answered) {
        if (opt.correct) cls += " is-correct";
        else if (step.correct === false && opt.text === step.picked) cls += " is-wrong";
        cls += " is-locked";
      }
      options.appendChild(el("button", {
        class: "option-btn" + cls,
        type: "button",
        on: {
          click: function () {
            if (step.answered) return;
            step.answered = true;
            step.picked = opt.text;
            step.correct = !!opt.correct;
            lesson.total += 1;
            if (opt.correct) {
              lesson.correct += 1;
              S.addXp(2);
              beep("correct");
            } else {
              beep("wrong");
            }
            render();
          }
        }
      }, [
        el("span", { class: "option-mark" }, [opt.correct && step.answered ? icon("check") : null]),
        el("span", { class: "option-text", text: opt.text })
      ]));
    });
    body.appendChild(options);

    if (step.answered) {
      body.appendChild(el("div", { class: "banner " + (step.correct ? "banner-good" : "banner-bad") }, [
        step.correct ? "정답이에요! +2 XP" : "아쉬워요. 정답을 확인해 보세요."
      ]));
      body.appendChild(el("p", { class: "quiz-reveal", lang: L(), text: q.sentence.text + (reading(q.sentence) ? "  ·  " + reading(q.sentence) : "") }));
    }

    if (step.answered) {
      foot.appendChild(footButton(lesson.idx >= lesson.steps.length - 1 ? "완료하기" : "다음", nextStep));
    } else {
      foot.appendChild(el("p", { class: "foot-hint", text: "뜻을 고르면 다음으로 넘어갈 수 있어요" }));
    }
  }

  /* --- 4) 말하기 --- */
  function renderSpeakStep(step, body, foot) {
    var lesson = UI.lesson;
    var s = step.s;
    body.appendChild(el("p", { class: "eyebrow", text: "따라 말하기 " + (lesson.idx + 1) + " / " + lesson.steps.length }));

    var footBtn = footButton(
      lesson.idx >= lesson.steps.length - 1 ? "완료하기" : "다음 문장",
      function () { if (!step.attempted) return; nextStep(); }
    );
    if (!step.attempted) {
      footBtn.disabled = true;
      footBtn.setAttribute("disabled", "disabled");
      footBtn.classList.add("is-disabled");
    }
    var hint = step.attempted ? null : el("p", { class: "foot-hint", text: "한 번 말해 보면 다음으로 넘어갈 수 있어요" });
    foot.appendChild(footBtn);
    if (hint) foot.appendChild(hint);

    var voice = buildVoiceCard(s, {
      showKo: true,
      onAttempt: function () {
        step.attempted = true;
        footBtn.disabled = false;
        footBtn.removeAttribute("disabled");
        if (footBtn.classList) footBtn.classList.remove("is-disabled");
        if (hint && hint.parentNode) hint.parentNode.removeChild(hint);
      }
    });
    body.appendChild(voice.node);
  }

  /* =========================================================
   *  단원평가 · 문제은행 · 영어원서 도서관
   * ========================================================= */
  function BK() { return global.KingBank; }
  function RD() { return global.KING_READERS; }

  function playText(text, loc, rate) {
    var ok = Speech.speak(text, loc, rate);
    if (!ok) toast("이 브라우저에서는 음성 재생을 지원하지 않아요.");
    return ok;
  }

  function scoreTone(score) {
    if (!score) return "new";
    if (score >= 80) return "good";
    if (score >= 50) return "mid";
    return "low";
  }

  /* ---------- 단원평가 목록 ---------- */
  function viewExam() {
    var c = course();
    var units = c.units;
    var passed = 0;
    var sum = 0;
    var tried = 0;
    var tries = 0;
    units.forEach(function (u) {
      var r = S.examRecord(u.id);
      if (r.best > 0) { tried += 1; sum += r.best; }
      if (r.passed) passed += 1;
      tries += r.tries || 0;
    });

    var wrap = el("div", { class: "view view-exam" });
    wrap.appendChild(viewHead("단원평가", c.name + " 단원마다 10문항 · " + BK().PASS_SCORE + "점이면 통과예요"));

    wrap.appendChild(el("section", { class: "exam-summary" }, [
      el("div", { class: "exam-summary-main" }, [
        el("span", { class: "exam-summary-num", text: passed + " / " + units.length }),
        el("span", { class: "exam-summary-label", text: "통과한 단원" })
      ]),
      el("div", { class: "exam-summary-side" }, [
        el("span", { text: tried ? "평균 최고 " + Math.round(sum / tried) + "점" : "아직 응시 전이에요" }),
        el("span", { text: "응시 " + tries + "회 · 최고 점수는 계속 남아요" })
      ])
    ]));

    var list = el("div", { class: "exam-list" });
    units.forEach(function (u) {
      var r = S.examRecord(u.id);
      list.appendChild(el("button", {
        class: "exam-row" + (r.passed ? " is-passed" : ""),
        type: "button",
        on: { click: function () { startExam(u.no); } }
      }, [
        el("span", { class: "exam-emoji", text: u.emoji }),
        el("span", { class: "exam-copy" }, [
          el("span", { class: "exam-day", text: "DAY " + u.no }),
          el("span", { class: "exam-title", text: u.title }),
          el("span", { class: "exam-goal", text: u.goal })
        ]),
        el("span", { class: "exam-score is-" + scoreTone(r.best) }, [
          el("b", { text: r.best ? r.best + "점" : "미응시" }),
          el("span", { text: r.passed ? "통과 ✓" : (r.tries ? "다시 도전" : "10문항") })
        ])
      ]));
    });
    wrap.appendChild(list);
    wrap.appendChild(el("p", { class: "footnote", text: "듣기·뜻·빈칸·문장 배열·문장 고르기를 섞어 냅니다. 다시 응시해도 최고 점수가 남아요." }));
    return wrap;
  }

  function startExam(unitNo) {
    var c = course();
    var u = S.unitOf(L(), unitNo);
    var qs = BK().buildUnitExam(c, u);
    if (!qs.length) { toast("이 단원은 아직 문제를 만들 수 없어요."); return; }
    UI.exam.unit = unitNo;
    UI.run = {
      kind: "exam",
      unitId: u.id,
      unitNo: u.no,
      title: "DAY " + u.no + " · " + u.title,
      sub: "단원평가",
      questions: qs,
      idx: 0,
      answers: [],
      reveal: false,
      locked: false,
      pickIndex: null,
      order: null,
      pool: null
    };
    Speech.stop();
    UI.view = "run";
    render();
  }

  /* ---------- 문제은행 ---------- */
  function viewBank() {
    var c = course();
    var wrap = el("div", { class: "view view-bank" });
    wrap.appendChild(viewHead("문제은행", c.name + " 14단원 문제에서 골라 풀고, 틀린 문제는 오답노트에 모아요"));

    var wrongN = S.wrongCount();
    var seg = el("div", { class: "seg seg-block", role: "tablist", "aria-label": "문제은행 메뉴" }, [

      segBlockBtn("오답노트 " + wrongN, UI.bank.tab === "wrong", function () { UI.bank.tab = "wrong"; render(); })
    ]);

      role: "tab",
      "aria-selected": active ? "true" : "false",
